# config_canary_regression — a canary node experiences failure during rollout;
# the control loop detects the regression via observability (CSR drop), rotates
# the failing canary node out of rotation (rollback), and verifies recovery (VS-7).
name: config_canary_regression
description: >
  At tick 24 the canary node (node-3) goes down for 30 ticks during a rollout.
  The config-engineer detects the CSR drop, rolls back by rotating the dead canary
  out of the serving pool, verifies mitigation, and restores rotation once the node recovers.
duration_h: 72
tick_s: 300
world: {nodes: 3, users: 2000, trials_per_tick: 2.0}
actors: [config-engineer, reaper, guard]
chaos:
  - {kind: node_down, at_tick: 24, node: node-3, ticks: 30}
expect:
  receipt_coverage: 1.0
  crash_rate_max: 0.05
  duplicate_work_max: 0
  guardrail_breaches_max: 0
  interventions_max: 0
  mttr_min_max: 30
  slo_breach_min_max: 300
