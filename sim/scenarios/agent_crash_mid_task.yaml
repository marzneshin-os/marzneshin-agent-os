# agent_crash_mid_task — chaos kills the config-engineer mid-mitigation.
# G5: the reaper must tombstone the open task (reconstructed from the event
# log), burn the fencing token, and coverage stays 100%.
name: agent_crash_mid_task
description: >
  A node dies at tick 24; the engineer starts mitigating and is killed at
  tick 26 — after task.started, before any receipt. The reaper (15m cadence)
  must find the zombie lease, write the tombstone for the OPEN task (not a
  synthetic one), revoke the lease with a fresh fencing token, and a new
  incident epoch lets a later mitigation complete. crash_rate stays in
  budget; duplicate_work stays 0 (cross-actor idempotency replay).
duration_h: 72
tick_s: 300
world: {nodes: 3, users: 2000, trials_per_tick: 2.0}
actors: [config-engineer, reaper, guard]
chaos:
  - {kind: node_down, at_tick: 24, node: node-1, ticks: 48}
  - {kind: agent_kill, at_tick: 26, agent: config-engineer}
expect:
  receipt_coverage: 1.0
  crash_rate_max: 0.5
  duplicate_work_max: 0
  guardrail_breaches_max: 0
  interventions_max: 0
  mttr_min_max: 60
  slo_breach_min_max: 999999
