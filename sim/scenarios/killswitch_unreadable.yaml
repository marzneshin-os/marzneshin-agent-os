# killswitch_unreadable — §6.3 fail-closed, proven end to end (VS-4).
# When no kill-switch path yields a fresh verdict (heartbeat dead > 900s),
# a worker must HALT L2 work and emit killswitch.unknown; "I don't know" is
# "stop", never "permitted". A corrupt state/KILL must read as an ENGAGED
# global kill (unreadable = engaged). The first heartbeat outage is healed by
# succession (§11.1 standby); the second is fatal until the operator
# reconciles — after which work provably resumes.
name: killswitch_unreadable
description: >
  Unreadable kill-switch state halts L2 work; corrupt KILL engages; operator
  reconcile resumes. Halt, event, engagement and recovery are all scored.
duration_h: 72
tick_s: 300
world: {nodes: 3, users: 200, trials_per_tick: 0.0}
actors: [heartbeat, sentinel]
chaos:
  - {kind: agent_stall, at_tick: 6, agent: heartbeat}     # succession heals this one
  - {kind: agent_stall, at_tick: 10, agent: heartbeat}    # standby dies: verdict goes stale
  - {kind: killswitch_recover, at_tick: 30, agent: heartbeat}
  - {kind: killswitch_corrupt, at_tick: 40}               # unreadable = engaged
  - {kind: killswitch_recover, at_tick: 50, agent: heartbeat}
expect:
  receipt_coverage: 1.0
  crash_rate_max: 0.5
  duplicate_work_max: 0
  guardrail_breaches_max: 0
  interventions_max: 0
  mttr_min_max: 999999
  slo_breach_min_max: 999999
  halted_unknown_min: 4        # stale window ticks 12..28 (every 2nd tick)
  halted_killed_min: 4         # corrupt window ticks 40..48
  fail_closed_engaged_min: 1   # UNKNOWN observed at least once
  resumed_after_unknown_min: 2 # resume after both recoveries
  sentinel_receipts_min: 20    # real receipted work happened around the halts
  successions_min: 1           # heartbeat standby took over (§11.1)
