# payment_provider_down — checkouts fail for 4h; the guard must alert
# out-of-band (§11.2 hard requirement) and the loop must not spam refunds.
name: payment_provider_down
description: >
  The payments provider refuses calls for 48 ticks (4h). Revenue dips; the
  guard actor fires the out-of-band alert; no duplicate work, no guardrail
  breach, no human needed.
duration_h: 72
tick_s: 300
world: {nodes: 3, users: 2000, trials_per_tick: 2.0}
actors: [config-engineer, reaper, guard]
chaos:
  - {kind: payment_provider_down, at_tick: 30, ticks: 48}
expect:
  receipt_coverage: 1.0
  crash_rate_max: 0.02
  duplicate_work_max: 0
  guardrail_breaches_max: 0
  interventions_max: 0
  slo_breach_min_max: 999999
