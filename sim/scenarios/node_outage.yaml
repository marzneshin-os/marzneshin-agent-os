# node_outage — a Marzneshin node dies; the control loop must rotate it out
# and recover CSR without a human (§16 scenario 1 of 6; VS-7's core drill).
name: node_outage
description: >
  A node dies at tick 24 (2h in) and stays dead for 36 ticks (3h). The
  config-engineer must detect the CSR drop, rotate the dead node out of the
  serving pool via an idempotent publish, verify with the probe fleet, and
  restore rotation once the fleet is healthy — zero interventions.
duration_h: 72
tick_s: 300
world: {nodes: 3, users: 2000, trials_per_tick: 2.0}
actors: [config-engineer, reaper, guard]
chaos:
  - {kind: node_down, at_tick: 24, node: node-2, ticks: 36}
expect:
  receipt_coverage: 1.0
  crash_rate_max: 0.02
  duplicate_work_max: 0
  guardrail_breaches_max: 0
  interventions_max: 0
  mttr_min_max: 30
  # Measured baseline (no-chaos runs, seeds 11/27/43): background flaps alone
  # cost 0-95 min of SLO breach. The 3h injected outage adds ~60-150 min of
  # window-refill response. 300 covers noise + response with margin; the
  # control loop's real bound is mttr_min_max (measured: 5 min).
  slo_breach_min_max: 300
