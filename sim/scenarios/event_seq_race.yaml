# event_seq_race — regression for the 2026-07-30 qa-gate duplicate actor_seq
# collision (§16.1: every production bug becomes a scenario; ADR-006).
# Two concurrent emitters (T1 file processor + T2 poller) both read watermark 4
# and both emitted seq 5,6 into the same partition. The watermark
# read-modify-write now runs under an exclusive flock; this storm (16 threads
# x 40 emits, one partition, one virtual instant) must allocate a dense,
# duplicate-free sequence — and detect_gaps must stay silent.
name: event_seq_race
description: >
  Concurrency regression: same-actor parallel emitters under the seq lock.
  Zero duplicate actor_seq values is the only acceptable outcome (§3.2).
duration_h: 24
tick_s: 300
world: {nodes: 3, users: 200, trials_per_tick: 0.0}
actors: [seq-storm]
chaos: []
expect:
  receipt_coverage: 1.0
  crash_rate_max: 0.5
  duplicate_work_max: 0
  guardrail_breaches_max: 0
  interventions_max: 0
  mttr_min_max: 999999
  slo_breach_min_max: 999999
  event_seq_duplicates_max: 0
