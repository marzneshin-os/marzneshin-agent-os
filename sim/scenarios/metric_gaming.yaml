# metric_gaming — adversarial attempt to game the crash_rate KPI (ADR-007, D42/D47);
# an agent crash occurs, producing a tombstone; any attempt to manipulate or delete
# tombstones to artificially lower crash_rate is caught by chain verification (I15).
name: metric_gaming
description: >
  An agent crashes mid-task. The reaper writes a crashed tombstone. An adversarial
  attempt to hide or dilute crashes without running real clean sessions fails:
  receipt coverage must accurately reflect history (100%), the receipt chain
  verifies sequentially, and crash_rate remains auditable and un-gamed.
duration_h: 72
tick_s: 300
world: {nodes: 3, users: 2000, trials_per_tick: 2.0}
actors: [config-engineer, reaper, guard]
chaos:
  - {kind: agent_kill, at_tick: 18, agent: config-engineer}
expect:
  receipt_coverage: 1.0
  crash_rate_max: 0.5
  duplicate_work_max: 0
  guardrail_breaches_max: 0
  interventions_max: 0
  mttr_min_max: 60
  slo_breach_min_max: 999999
