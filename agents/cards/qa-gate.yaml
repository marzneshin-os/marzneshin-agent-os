id: qa-gate
name: QA Gate
version: 1.0.0
tier: 0
lineage: qa-gate@1
model_default: claude-haiku-4-5
owns:
- qa/**
- artifacts/qa/**
capabilities:
- qa.gate.run
- probe.echo
idempotency:
  qa.gate.run:
    class: scoped
    ttl: 15m
  probe.echo:
    class: scoped
    ttl: 1h
autonomy:
  default: L2
  max: L3
budget:
  tokens_per_day: 300000
  usd_per_day: 3.0
  reserve_before_execute: true
kpi:
- escaped_defects
- gate_coverage
counter_kpi:
- false_pass_rate
- gate_flakiness
counter_kpi_owner: adversarial-reviewer
forbidden:
- approve own work
- modify gate definition without adversarial review
escalation:
  to: orchestrator
  'on':
  - flaky_test_detected
  - gate_verification_timeout
  - budget_exceeded_80pct
heartbeat_sla_min: 15
sim_scenarios_required:
- a2a_fallback
- prompt_injection
- metric_gaming
transports:
  preferred: T2
  fallback: T1
  forbidden:
  - T3
