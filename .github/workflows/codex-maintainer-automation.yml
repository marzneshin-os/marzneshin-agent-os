name: Codex Maintainer Automation & Issue Resolver

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to solve"
        required: true
      task_id:
        description: "Marzneshin Task ID"
        required: false
        default: "T-CODEX-AUTO"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autonomous-fix:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       (startsWith(github.event.comment.body, '/codex') || startsWith(github.event.comment.body, '@codex')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml requests

      - name: Execute Autonomous Issue Triage & Patch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number || inputs.issue_number }}"
          TASK_ID="${{ inputs.task_id || 'T-CODEX-AUTO' }}"
          python3 scripts/codex_bridge.py triage \
            --issue "$ISSUE_NUM" \
            --task-id "$TASK_ID" \
            --create-pr
